name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::319279229867:role/GitHubActions-PolicyAsCode
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Check Terraform State
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          echo "Environment: ${{ matrix.environment }}"
          echo "Terraform state:"
          terraform state list

      - name: Verify Dev S3 Bucket State
        if: matrix.environment == 'dev'
        working-directory: terraform/environments/dev
        run: |
          terraform state list | grep -q "module.infrastructure.aws_s3_bucket.this"
          echo "Dev S3 bucket is present in Terraform state."

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Install Checkov
        run: pip install checkov==3.3.17

      - name: Checkov Scan
        run: checkov -d terraform --framework terraform

      - name: Terraform Plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform plan -lock=false

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.environment == 'dev'
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve