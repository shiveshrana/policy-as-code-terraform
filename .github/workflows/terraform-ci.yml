name: Terraform CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  aws-auth-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::319279229867:role/GitHubActions-PolicyAsCode
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity