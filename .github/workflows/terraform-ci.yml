name: Terraform CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  oidc-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC claims
        shell: bash
        env:
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          response=$(curl -sS \
            -H "Authorization: bearer $OIDC_TOKEN" \
            "${OIDC_URL}&audience=sts.amazonaws.com")

          token=$(echo "$response" | jq -r '.value')

          payload=$(echo "$token" \
            | cut -d. -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq .)

          echo "$payload" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            event_name,
            ref,
            job_workflow_ref
          }'